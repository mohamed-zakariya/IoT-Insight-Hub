# frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: insight-hub
  labels:
    app: insight-hub
    component: frontend
spec:
  replicas: 3                             
  selector:
    matchLabels:
      app: insight-hub
      component: frontend
  template:
    metadata:
      labels:
        app: insight-hub
        component: frontend
    spec:
      containers:
        - name: frontend-container
          image: iotinsighthub/insight-hub-dashboard:S4_v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80            
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
