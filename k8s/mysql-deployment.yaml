# mysql-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: insight-hub
  labels:
    app: insight-hub
    component: database
spec:
  replicas: 1                              
  selector:
    matchLabels:
      app: insight-hub
      component: database
  template:
    metadata:
      labels:
        app: insight-hub
        component: database
    spec:
      containers:
        - name: mysql
          image: mysql:8.3
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "GmNgl69ZW9"
            - name: MYSQL_DATABASE
              value: "sql8774445"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc           
